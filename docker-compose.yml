services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billflow
      POSTGRES_USER: billflow
      POSTGRES_PASSWORD: billflow_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://billflow:billflow_dev@postgres:5432/billflow
      JWT_SECRET: local-docker-secret-change-before-deployment
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      AUTO_CREATE_SCHEMA: "false"
      BILLING_WEBHOOK_SECRET: local-webhook-secret-change-before-deployment
      NOTIFICATION_RECEIPT_WEBHOOK_SECRET: local-receipt-secret-change-before-deployment
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://billflow:billflow_dev@postgres:5432/billflow
      JWT_SECRET: local-docker-secret-change-before-deployment
      BILLING_WEBHOOK_SECRET: local-webhook-secret-change-before-deployment
      NOTIFICATION_RECEIPT_WEBHOOK_SECRET: local-receipt-secret-change-before-deployment
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUTO_CREATE_SCHEMA: "false"
      PENDING_PAYMENT_TIMEOUT_SECONDS: ${PENDING_PAYMENT_TIMEOUT_SECONDS:-900}
      GATEWAY_POLL_INTERVAL_SECONDS: ${GATEWAY_POLL_INTERVAL_SECONDS:-60}
      GATEWAY_STATUS_BASE_URL: ${GATEWAY_STATUS_BASE_URL:-}
      GATEWAY_STATUS_TOKEN: ${GATEWAY_STATUS_TOKEN:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sandbox}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@billflow.local}
      SMS_PROVIDER: ${SMS_PROVIDER:-sandbox}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-sandbox}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      QUEUE_BACKLOG_ALERT_THRESHOLD: ${QUEUE_BACKLOG_ALERT_THRESHOLD:-250}
      QUEUE_OLDEST_ALERT_SECONDS: ${QUEUE_OLDEST_ALERT_SECONDS:-900}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://billflow:billflow_dev@postgres:5432/billflow
      JWT_SECRET: local-docker-secret-change-before-deployment
      BILLING_WEBHOOK_SECRET: local-webhook-secret-change-before-deployment
      NOTIFICATION_RECEIPT_WEBHOOK_SECRET: local-receipt-secret-change-before-deployment
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
